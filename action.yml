name: 'SEO Check by SEO AI Audits'
description: 'Catch SEO mistakes before they ship: accidental noindex, missing titles, titles too wide for Google, broken internal links.'
author: 'SEO AI Audits'
branding:
  icon: 'search'
  color: 'blue'

inputs:
  path:
    description: 'Folder of built HTML to check (static sites). No network needed. Use this, or urls / start-url.'
    required: false
  site-url:
    description: 'Public URL of the site in `path` (e.g. https://example.com), so canonical tags can be compared.'
    required: false
  urls:
    description: 'Live URLs to check, separated by spaces, commas or new lines.'
    required: false
  start-url:
    description: 'Crawl a live site from this URL (same host only), up to max-pages.'
    required: false
  max-pages:
    description: 'Most pages to crawl from start-url.'
    default: '50'
  max-link-checks:
    description: 'Most internal links to status-check in URL mode.'
    default: '200'
  ignore:
    description: 'Check IDs to skip, comma-separated (see the README), e.g. h1-multiple,html-lang-missing.'
    required: false
  ignore-paths:
    description: 'Path globs to skip, comma-separated, e.g. /drafts/*,/404.html.'
    required: false
  fail-on:
    description: 'Fail the step on: error (default), warning, or never.'
    default: 'error'

outputs:
  errors:
    description: 'Number of errors found.'
    value: ${{ steps.check.outputs.errors }}
  warnings:
    description: 'Number of warnings found.'
    value: ${{ steps.check.outputs.warnings }}
  notices:
    description: 'Number of notices found.'
    value: ${{ steps.check.outputs.notices }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - shell: bash
      run: python -m pip install --quiet --disable-pip-version-check -r "$GITHUB_ACTION_PATH/requirements.txt"
    - id: check
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        IN_PATH: ${{ inputs.path }}
        IN_SITE_URL: ${{ inputs.site-url }}
        IN_URLS: ${{ inputs.urls }}
        IN_START_URL: ${{ inputs.start-url }}
        IN_MAX_PAGES: ${{ inputs.max-pages }}
        IN_MAX_LINK_CHECKS: ${{ inputs.max-link-checks }}
        IN_IGNORE: ${{ inputs.ignore }}
        IN_IGNORE_PATHS: ${{ inputs.ignore-paths }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=(--max-pages "$IN_MAX_PAGES" --max-link-checks "$IN_MAX_LINK_CHECKS" --fail-on "$IN_FAIL_ON")
        [ -n "$IN_PATH" ] && args+=(--path "$IN_PATH")
        [ -n "$IN_SITE_URL" ] && args+=(--site-url "$IN_SITE_URL")
        [ -n "$IN_URLS" ] && args+=(--urls "$IN_URLS")
        [ -n "$IN_START_URL" ] && args+=(--start-url "$IN_START_URL")
        [ -n "$IN_IGNORE" ] && args+=(--ignore "$IN_IGNORE")
        [ -n "$IN_IGNORE_PATHS" ] && args+=(--ignore-paths "$IN_IGNORE_PATHS")
        python -m seocheck "${args[@]}"
